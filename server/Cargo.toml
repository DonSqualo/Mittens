[package]
name = "mittens-server"
version = "0.1.0"
edition = "2021"
description = "Development server for Mittens CAD with file watching and Lua execution"

[features]
default = ["manifold-support"]
manifold-support = ["dep:manifold3d"]

[dependencies]
# Web server
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio = { version = "1", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"

# File watching
notify = "6.1"
notify-debouncer-mini = "0.4"

# Lua interpreter
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"

# CSG geometry
manifold3d = { version = "0.0.6", optional = true }

# 3MF export (ZIP with XML)
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
