<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mittens</title>
  <style>
    @font-face {
      font-family: 'Terminal';
      src: local('Courier New'), local('Consolas'), local('monospace');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Consolas, monospace;
      color: #ccc;
    }

    #main-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #main-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .tui-window {
      position: absolute;
      background: #000;
      border: 2px solid #888;
      box-shadow: 4px 4px 0 #333;
      min-width: 200px;
      display: none;
      z-index: 50;
    }

    .tui-window.visible {
      display: block;
    }

    .tui-titlebar {
      background: #888;
      color: #000;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .tui-close {
      cursor: pointer;
      font-size: 14px;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .tui-close:hover {
      background: #666;
    }

    .tui-content {
      padding: 8px;
    }

    .tui-label {
      position: absolute;
      top: 8px;
      left: 12px;
      color: #666;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      pointer-events: none;
    }

    .tui-status {
      color: #444;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .status-link {
      position: absolute;
      left: 12px;
      bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-decoration: none;
      cursor: pointer;
      z-index: 120;
      padding: 2px 4px;
      border: 1px solid transparent;
      transition: border-color 120ms ease, background-color 120ms ease;
    }

    .status-link:hover {
      border-color: #0a5;
      background: rgba(0, 40, 0, 0.25);
    }

    .status-link.loading {
      border-color: #0f0;
      background: rgba(0, 80, 0, 0.35);
    }

    .status-link.loading #status-detail {
      color: #9f9 !important;
      font-size: 11px !important;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .download-buttons {
      position: absolute;
      right: 12px;
      bottom: 10px;
      z-index: 140;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .download-btn {
      border: 1px solid #0a5;
      background: rgba(0, 35, 0, 0.5);
      color: #9f9;
      font-size: 10px;
      font-family: 'Courier New', Consolas, monospace;
      letter-spacing: 1px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .download-btn:hover {
      background: rgba(0, 60, 0, 0.65);
      color: #cfc;
    }

    .download-btn:disabled {
      border-color: #444;
      color: #666;
      background: rgba(20, 20, 20, 0.5);
      cursor: not-allowed;
    }

    #loading-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28px;
      z-index: 150;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      background: rgba(0, 0, 0, 0.7);
      border-top: 1px solid #0a5;
      font-size: 11px;
      color: #9f9;
      letter-spacing: 1px;
    }

    #loading-bar.visible {
      display: flex;
    }

    #loading-bar.state-error {
      border-top-color: #a00;
      color: #faa;
    }

    #loading-bar-track {
      flex: 1;
      height: 10px;
      border: 1px solid #0a5;
      background: rgba(0, 35, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    #loading-bar.state-error #loading-bar-track {
      border-color: #a00;
      background: rgba(35, 0, 0, 0.35);
    }

    #loading-bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(120, 255, 120, 0.85), transparent);
      animation: loading-slide 1.2s linear infinite;
    }

    #loading-bar.state-error #loading-bar-fill {
      background: linear-gradient(90deg, transparent, rgba(255, 110, 110, 0.85), transparent);
    }

    @keyframes loading-slide {
      from { transform: translateX(-120%); }
      to { transform: translateX(270%); }
    }

    #graph-window {
      bottom: 20px;
      right: 20px;
      width: 320px;
    }

    #graph-canvas {
      width: 300px;
      height: 180px;
      background: #000;
      display: block;
    }

    #circuit-overlay {
      position: absolute;
      pointer-events: none;
      z-index: 100;
      display: none;
      transform-origin: top left;
    }

    #circuit-overlay.visible {
      display: block;
    }

    .scanline {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.1) 0px,
        rgba(0, 0, 0, 0.1) 1px,
        transparent 1px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 9999;
    }

    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      pointer-events: none;
      z-index: 9998;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="scanline"></div>

  <div id="main-view">
    <canvas id="main-canvas"></canvas>
    <div class="tui-label">Mittens</div>
    <a id="status-link" class="status-link" href="/graph" title="Open renderer/backends menu (Ctrl+K)">
      <div class="tui-status" id="status-detail"></div>
      <div class="tui-status" id="status">⏳ CONNECTING...</div>
    </a>
    <div id="loading-bar" aria-live="polite">
      <div id="loading-bar-text">Loading...</div>
      <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
      <div id="loading-bar-elapsed">0s</div>
    </div>
    <div class="download-buttons">
      <button id="download-stl-btn" class="download-btn" title="Download current export file(s)" disabled>STL</button>
      <button id="download-step-btn" class="download-btn" title="Download a single STEP of the whole assembly" disabled>STEP</button>
    </div>
    <div id="circuit-overlay"></div>
    
    <!-- Camera HUD -->
    <div id="camera-hud" style="position: absolute; top: 8px; right: 12px; font-size: 9px; color: #555; text-align: right; z-index: 100;">
      <div id="camera-info" style="cursor: pointer; padding: 2px 0;" title="Click to copy Lua config">
        <span id="camera-pos">[0, 0, 0]</span> → <span id="camera-target">[0, 0, 0]</span> <span style="color: #444;">⧉</span>
      </div>
      <div id="home-btn" style="cursor: pointer; color: #444; margin-top: 2px;" title="Reset camera (H)">[H] home</div>
    </div>
  </div>

  <div id="graph-window" class="tui-window">
    <div class="tui-titlebar">
      <span>Bz Field Plot</span>
      <span class="tui-close" onclick="closeWindow('graph-window')">X</span>
    </div>
    <div class="tui-content">
      <canvas id="graph-canvas" width="300" height="180"></canvas>
    </div>
  </div>

  <div id="nanovna-window" class="tui-window" style="bottom: 220px; right: 20px; width: 320px;">
    <div class="tui-titlebar">
      <span>NanoVNA S11</span>
      <span class="tui-close" onclick="closeWindow('nanovna-window')">X</span>
    </div>
    <div class="tui-content">
      <canvas id="nanovna-canvas" width="300" height="180"></canvas>
    </div>
  </div>

  <script>
    function closeWindow(id) {
      document.getElementById(id).classList.remove('visible');
    }

    function openWindow(id) {
      document.getElementById(id).classList.add('visible');
    }

    // Draggable windows
    let topZIndex = 50;
    document.querySelectorAll('.tui-titlebar').forEach(titlebar => {
      let isDragging = false;
      let offsetX, offsetY;
      const win = titlebar.parentElement;

      titlebar.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('tui-close')) return;
        win.style.zIndex = ++topZIndex;
        isDragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        win.style.left = (e.clientX - offsetX) + 'px';
        win.style.right = 'auto';
        win.style.top = (e.clientY - offsetY) + 'px';
        win.style.bottom = 'auto';
      });

      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    });
  </script>

  <script type="module" src="src/main.ts"></script>
</body>
</html>
